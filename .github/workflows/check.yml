name: Check

# Runs the template's own check (tests, then every notebook headless) on each OS
# the pixi workspace supports, so Windows is tested without a Windows machine.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.80.0
          cache: true
          locked: true
      - run: pixi run check
