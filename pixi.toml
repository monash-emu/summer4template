[workspace]
channels = ["conda-forge"]
name = "summer4template"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
api = { cmd = "python tools/summer4_api.py", description = "Look up the installed summer4 API: pixi run api [NAME | --search WORD | --source NAME | --where]" }
check = { cmd = "python tools/check.py", description = "Run the tests, then every notebook headless (--quick: tests only)" }
clear-notebooks = { cmd = "python tools/clear_notebooks.py", description = "Clear outputs from every notebook before committing" }

[dependencies]
python = "3.13.*"
ipykernel = ">=7.2.0,<8"

[pypi-dependencies]
# summer4 v0.3.0a1 (https://github.com/monash-emu/summer4/releases/tag/v0.3.0a1)
summer4 = { git = "https://github.com/monash-emu/summer4.git", tag = "v0.3.0a1", extras = ["calibration", "pandas", "frames"] }
example_project = { path = "src/example_project", editable = true }
# JAX is pinned to the 0.6 series, the version summer4 develops and tests on. summer4's
# pyproject.toml only sets lower bounds (jax>=0.6.0), so without a pin pixi resolves the
# newest JAX, which summer4 has not tested: JAX 0.12 breaks NUTS chain_method="parallel"
# with diffrax solvers (through equinox 0.13.8). To move it, see "JAX version" in README.md.
jax = ">=0.6,<0.7"
jaxlib = ">=0.6,<0.7"
# numpyro 0.20 and later require jax>=0.7, so bound it to match the JAX pin.
numpyro = ">=0.16,<0.20"
arviz = { version = ">=1.0, <2", extras = ["plotly"] }
plotly = ">=6.6.0, <7"
ipywidgets = ">=8.1.8, <9"
nbformat = ">=5.10.4, <6"
nbclient = ">=0.10, <1"
pytest = ">=8, <10"
